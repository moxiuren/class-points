<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Points Backend Service</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.05);
      text-align: center;
      max-width: 400px;
    }
    h1 {
      margin-top: 0;
      color: #111;
      font-size: 1.5rem;
    }
    p {
      color: #666;
      margin: 1rem 0;
    }
    .status {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      background-color: #d1fae5;
      color: #065f46;
      font-weight: 600;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Class Points API</h1>
    <p>后端服务运行正常，数据库连接就绪。</p>
    <span class="status">RUNNING</span>
  </div>
</body>
</html>
